# Exact environment used for the paper's runs (NERSC Perlmutter, linux-64, NVIDIA
# A100, CUDA 12). Every package the code imports, and its dependencies, is pinned
# to the version that produced the published results.
#
#   conda env create -f environment.yml
#   conda activate flowsn2
#
# CPU-only machines (laptops, plotting): use environment-cpu.yml instead.
name: flowsn2
channels:
  - conda-forge
dependencies:
  - python=3.10.13
  - pip=24.0
  - setuptools=69.2.0
  - wheel=0.42.0
  - pip:
      # --- JAX (CUDA 12) ---
      - jax==0.4.33
      - jaxlib==0.4.33
      - jax-cuda12-pjrt==0.4.33
      - jax-cuda12-plugin==0.4.33
      - nvidia-cublas-cu12==12.4.2.65
      - nvidia-cuda-cupti-cu12==12.4.99
      - nvidia-cuda-nvcc-cu12==12.4.99
      - nvidia-cuda-nvrtc-cu12==12.4.99
      - nvidia-cuda-runtime-cu12==12.4.99
      - nvidia-cudnn-cu12==9.7.0.66
      - nvidia-cufft-cu12==11.2.0.44
      - nvidia-cusolver-cu12==11.6.0.99
      - nvidia-cusparse-cu12==12.3.0.142
      - nvidia-nccl-cu12==2.20.5
      - nvidia-nvjitlink-cu12==12.4.99
      - ml-dtypes==0.5.1
      - opt-einsum==3.3.0
      # --- inference / flows ---
      - numpyro==0.16.1
      - multipledispatch==1.0.0
      - flowjax==17.0.2
      - equinox==0.11.3
      - paramax==0.0.0
      - jaxtyping==0.2.28
      - typeguard==2.13.3
      - optax==0.2.4
      - chex==0.1.88
      - absl-py==2.1.0
      - etils==1.11.0
      - toolz==1.0.0
      - typing_extensions==4.15.0
      - tqdm==4.66.2
      # --- numerics / cosmology (vendored wcosmo needs these) ---
      - numpy==1.26.4
      - scipy==1.15.1
      - astropy==6.0.0
      - astropy-iers-data==0.2024.3.11.18.33.3
      - pyerfa==2.0.1.1
      - array-api-compat==1.10.0
      - plum-dispatch==2.5.7
      - beartype==0.20.0
      - rich==13.9.4
      - markdown-it-py==3.0.0
      - mdurl==0.1.2
      - pygments==2.19.1
      - pyyaml==6.0.1
      # --- plotting ---
      - matplotlib==3.8.3
      - corner==2.2.3
      - contourpy==1.2.0
      - cycler==0.12.1
      - fonttools==4.49.0
      - kiwisolver==1.4.5
      - packaging==24.0
      - pillow==10.2.0
      - pyparsing==3.1.2
      - python-dateutil==2.9.0.post0
      - six==1.16.0
      # --- this repository (editable) ---
      - -e .
