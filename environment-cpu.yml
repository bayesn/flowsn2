# Same pinned versions as environment.yml without the CUDA wheels, for CPU-only
# machines (figures, tables, smoke tests). The paper's MCMC runs used
# environment.yml on GPUs.
#
#   conda env create -f environment-cpu.yml
#   conda activate flowsn2-cpu
name: flowsn2-cpu
channels:
  - conda-forge
dependencies:
  - python=3.10.13
  - pip=24.0
  - setuptools=69.2.0
  - wheel=0.42.0
  - pip:
      # --- JAX (CPU) ---
      - jax==0.4.33
      - jaxlib==0.4.33
      - ml-dtypes==0.5.1
      - opt-einsum==3.3.0
      # --- inference / flows ---
      - numpyro==0.16.1
      - multipledispatch==1.0.0
      - flowjax==17.0.2
      - equinox==0.11.3
      - paramax==0.0.0
      - jaxtyping==0.2.28
      - typeguard==2.13.3
      - optax==0.2.4
      - chex==0.1.88
      - absl-py==2.1.0
      - etils==1.11.0
      - toolz==1.0.0
      - typing_extensions==4.15.0
      - tqdm==4.66.2
      # --- numerics / cosmology (vendored wcosmo needs these) ---
      - numpy==1.26.4
      - scipy==1.15.1
      - astropy==6.0.0
      - astropy-iers-data==0.2024.3.11.18.33.3
      - pyerfa==2.0.1.1
      - array-api-compat==1.10.0
      - plum-dispatch==2.5.7
      - beartype==0.20.0
      - rich==13.9.4
      - markdown-it-py==3.0.0
      - mdurl==0.1.2
      - pygments==2.19.1
      - pyyaml==6.0.1
      # --- plotting ---
      - matplotlib==3.8.3
      - corner==2.2.3
      - contourpy==1.2.0
      - cycler==0.12.1
      - fonttools==4.49.0
      - kiwisolver==1.4.5
      - packaging==24.0
      - pillow==10.2.0
      - pyparsing==3.1.2
      - python-dateutil==2.9.0.post0
      - six==1.16.0
      # --- this repository (editable) ---
      - -e .
